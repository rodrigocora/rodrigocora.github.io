<div class="ts-search-box" id="ts-search-box">
  <input
    type="search"
    id="ts-search"
    placeholder="Search this blog…"
    aria-label="Search this blog"
    autocomplete="off"
    spellcheck="false"
    role="combobox"
    aria-expanded="false"
    aria-controls="ts-search-results"
  />
  <ul id="ts-search-results" class="ts-search-results" role="listbox" hidden></ul>
</div>

<script src="{{site.baseurl}}/assets/tinysearch/search.js" defer></script>
